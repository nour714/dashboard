<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Africa Map Silhouette with flight trail integration in Brand Red -->
  <g fill="#D42B2B">
    <!-- Main Africa Continent Body -->
    <path d="M 46 14 
             C 52 13, 62 15, 68 18
             C 74 21, 78 26, 82 32
             C 86 38, 87 45, 85 52
             C 83 58, 80 64, 82 70
             C 84 76, 78 84, 72 90
             C 66 96, 58 102, 54 104
             C 50 106, 46 100, 44 94
             C 42 88, 38 84, 32 80
             C 24 75, 14 74, 12 70
             C 10 66, 14 62, 20 62
             C 28 62, 34 60, 40 56
             C 44 52, 44 44, 42 38
             C 40 32, 36 28, 38 22
             C 40 16, 42 14, 46 14 Z" />
    
    <!-- Dynamic curved tail / lower wing sweep -->
    <path d="M 12 70
             C 20 68, 30 72, 42 78
             C 50 82, 58 88, 54 104
             C 48 98, 38 90, 26 84
             C 16 78, 10 74, 12 70 Z" opacity="0.95" />
  </g>

  <!-- Flight Path Trails (White Stripes through the red continent) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trail 1 -->
    <path d="M 16 72 C 28 72, 42 66, 56 52" stroke-width="4.5" />
    <!-- Trail 2 -->
    <path d="M 22 79 C 34 78, 46 70, 58 56" stroke-width="3.5" />
    <!-- Trail 3 -->
    <path d="M 30 85 C 40 83, 50 76, 60 62" stroke-width="2.5" />
  </g>

  <!-- White Airplane Silhouette -->
  <g fill="#ffffff" transform="translate(62, 42) rotate(42) scale(0.9)">
    <!-- Fuselage & Nose -->
    <path d="M 0 -16 
             C 1.5 -16, 2.8 -10, 2.8 -2 
             L 2.8 10 
             C 2.8 13, 1.8 15, 0 15 
             C -1.8 15, -2.8 13, -2.8 10 
             L -2.8 -2 
             C -2.8 -10, -1.5 -16, 0 -16 Z" />
    <!-- Main Wings -->
    <path d="M 0 -3 
             L 16 6 
             L 16 9.5 
             L 2.2 6.5 
             L 2.2 11 
             L 7 14.5 
             L 7 16.5 
             L 0 15 
             L -7 16.5 
             L -7 14.5 
             L -2.2 11 
             L -2.2 6.5 
             L -16 9.5 
             L -16 6 
             Z" />
  </g>
</svg>
