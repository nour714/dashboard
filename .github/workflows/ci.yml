name: AfricaTravel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_only_jwt_secret_do_not_use_in_prod_00000000
      DEFAULT_ADMIN_PASSWORD: CiTestOnlyPassword123
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/africatravel_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npx eslint server/ test/
        continue-on-error: false

      - name: Security Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Full Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_only_jwt_secret_do_not_use_in_prod_00000000
          DEFAULT_ADMIN_PASSWORD: CiTestOnlyPassword123
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/africatravel_test?schema=public

