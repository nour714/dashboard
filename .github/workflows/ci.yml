name: AfricaTravel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_only_jwt_secret_do_not_use_in_prod_00000000
      DEFAULT_ADMIN_PASSWORD: CiTestOnlyPassword123
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/africatravel_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/africatravel_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npx eslint server/ test/
        continue-on-error: false

      - name: Security Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Full Test Suite
        if: always()
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_only_jwt_secret_do_not_use_in_prod_00000000
          DEFAULT_ADMIN_PASSWORD: CiTestOnlyPassword123
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/africatravel_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/africatravel_test?schema=public

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: africatravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ci_test_only_jwt_secret_do_not_use_in_prod_00000000
      DEFAULT_ADMIN_PASSWORD: CiTestOnlyPassword123
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/africatravel_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/africatravel_test?schema=public
      RATE_LIMIT_MAX_AUTH: 1000
      RATE_LIMIT_MAX_API: 5000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: node prisma/seed.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-migrations:
    name: Apply Production Database Migrations
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Verify migration secret exists
        run: |
          if [ -z "${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}" ]; then
            echo "::error title=Missing Secret::PRODUCTION_DIRECT_DATABASE_URL secret is not configured in GitHub Repository Secrets. Go to Settings -> Secrets and variables -> Actions -> Repository secrets to add it."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check migration status (read-only, diagnostic)
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
        continue-on-error: true

      - name: Apply pending migrations to production database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}


