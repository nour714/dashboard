<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#131b2e" />
  <title>AfricaTravel — Travel Operations</title>

  <!-- Immediate Language & Direction Initialization to Prevent Layout Shift -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('africatravel.language');
        var lang = stored;
        if (!lang) {
          if (navigator.language && navigator.language.startsWith('ar')) {
            lang = 'ar';
          } else {
            lang = 'en';
          }
        }
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        } else {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (e) {}
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="alternate icon" href="/assets/logo.png" />

  <!-- Google Fonts: Geist, Inter & Noto Sans Arabic -->
