<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AfricaTravel — High-efficiency Travel Operations and Airline Ticketing Platform" />
  <meta name="theme-color" content="#131b2e" />
  <title>AfricaTravel — Travel Operations</title>

  <!-- Immediate Language, Direction & Sidebar State Initialization to Prevent Layout Shift -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('africatravel.language');
        var lang = stored;
        if (!lang) {
          if (navigator.language && navigator.language.startsWith('ar')) {
            lang = 'ar';
          } else {
            lang = 'en';
          }
        }
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        } else {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }

        if (localStorage.getItem('africatravel.sidebarCollapsed') === '1') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="alternate icon" href="/assets/logo.png" />

  <!-- PWA Manifest, iOS Touch Icon & App Metadata -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AfricaTravel" />

  <!-- Google Fonts: Geist, Inter & Noto Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@600;700&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets with Cache Busting -->
  <link rel="stylesheet" href="/styles/tokens.css?v=2.5.0" />
  <link rel="stylesheet" href="/styles/base.css?v=2.5.0" />
  <link rel="stylesheet" href="/styles/layout.css?v=2.5.0" />
  <link rel="stylesheet" href="/styles/components.css?v=2.5.0" />
  <link rel="stylesheet" href="/styles/utilities.css?v=2.5.0" />
  <link rel="stylesheet" href="/styles/responsive.css?v=2.5.0" />
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <div id="app-boot-splash" class="boot-splash">
      <img src="/assets/icon-512.png" alt="AfricaTravel" class="boot-splash-logo" />
      <h1 class="boot-splash-title">AfricaTravel</h1>
      <p class="boot-splash-tagline" id="boot-splash-tagline">Travel Operations Platform</p>
      <p class="boot-splash-status" id="boot-splash-status">Setting things up…</p>
      <div class="boot-splash-progress">
        <div class="boot-splash-progress-bar" id="boot-splash-progress-bar"></div>
      </div>
      <ul class="boot-splash-steps">
        <li class="boot-splash-step" id="boot-step-session"><span class="boot-step-icon"></span><span id="boot-step-session-text">Checking session</span></li>
        <li class="boot-splash-step" id="boot-step-data"><span class="boot-step-icon"></span><span id="boot-step-data-text">Loading your data</span></li>
        <li class="boot-splash-step" id="boot-step-shell"><span class="boot-step-icon"></span><span id="boot-step-shell-text">Preparing your dashboard</span></li>
      </ul>
      <p class="boot-splash-secure" id="boot-splash-secure">🔒 Secure connection</p>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="/js/app.js?v=2.5.0"></script>
</body>
</html>
